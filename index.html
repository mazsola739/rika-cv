<!doctype html>
<html lang="en" data-mode="pro">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Erika Rostás – Full-stack Developer. React, TypeScript, Node.js, Jest. Switch between the professional and the fun version of the CV." />
    <meta name="theme-color" content="#efefef" />
    <!-- Light only: keeps browsers with a forced dark mode for websites (e.g. Samsung Internet) from recolouring the CV. -->
    <meta name="color-scheme" content="only light" />
    <title>Erika Rostás – Full-stack Developer</title>
    <script>
      // Pick the version before first paint so there is no flash of the wrong one.
      // A visit starts in pro, in English. The link can ask for another one (?mode=fun, ?lang=hu), and a reload keeps
      // what was chosen in this tab (sessionStorage "rika-cv", written by rememberSetting in src/hooks/dom.ts).
      ;(function () {
        var params = new URLSearchParams(window.location.search)
        var saved = {}
        try {
          saved = JSON.parse(sessionStorage.getItem('rika-cv') || '{}') || {}
        } catch (error) {}
        var lang = params.get('lang') || saved.lang
        var mode = params.get('mode') || saved.mode
        document.documentElement.lang = lang === 'hu' ? 'hu' : 'en'
        if (mode === 'fun') document.documentElement.dataset.mode = 'fun'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
